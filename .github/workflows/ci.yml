name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml re-runs this whole workflow against the tagged commit.
  workflow_call:
    secrets:
      FORBIDDEN_IDENTIFIERS:
        required: false

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build locked non-root image
        run: docker build -f deploy/container/Dockerfile -t gpo-lens:smoke .

      - name: Smoke loopback, read-only image, TLS access control and fixture ingest
        run: python3 deploy/container/smoke.py gpo-lens:smoke

  identifier-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # gate walks history when publication.toml is absent; refuses shallow
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # publication.toml declares visibility = "public", so an unset or empty
      # FORBIDDEN_IDENTIFIERS secret FAILS this job (exit 1) rather than skipping:
      # scripts/check_committed_identifiers.py _unconfigured() raises GateError for
      # a public repo. (Only a "private-until-review" or undeclared repo skips.)
      - name: Check for committed work-domain identifiers
        env:
          FORBIDDEN_IDENTIFIERS: ${{ secrets.FORBIDDEN_IDENTIFIERS }}
        run: python scripts/check_committed_identifiers.py

  lint-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies (from lockfile)
        run: uv sync --locked --extra dev --extra web

      - name: Ruff lint
        run: .venv/bin/ruff check .

      # Also covers Python code blocks inside docs/ and plans/ — ruff formats
      # fenced examples in Markdown, so a hand-styled spec example fails here.
      # Fix with `ruff format .`, never by hand.
      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: Mypy typecheck
        run: .venv/bin/mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies (from lockfile)
        run: uv sync --locked --extra dev --extra web

      - name: Run tests with coverage gate
        # samples/ is gitignored, so sample-dependent calibration tests are
        # skipped in CI. The synthetic fixture estates (tests/fixtures/ +
        # tests/golden_estate/) drive coverage to ~92% without samples. The 85%
        # floor catches real regressions while leaving headroom for CLI/web
        # presentation-layer evolution.
        # -n auto (pytest-xdist, from addopts) parallelizes the run. Coverage is
        # re-added here because addopts drops it for fast local runs; the 85%
        # floor is the CI gate. (COVERAGE_CORE=sysmon was evaluated but hangs
        # under xdist with coverage 7.14, so the default tracer is used.)
        run: .venv/bin/pytest -q --cov=src --cov-report=term-missing --cov-fail-under=85

  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # Audit runtime, web and the IIS installer's executed build backend
      # against the pinned lockfile. Other dev-only tooling stays excluded.
      - name: Export locked dependencies
        run: uv export --locked --extra web --group build --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit --strict --requirement requirements-audit.txt

  collector-readonly:
    # Parses (never executes) the DC/RSAT-side PowerShell with the PowerShell
    # AST and fails on any command, .NET call or file-write target outside the
    # explicit allowlist in tests/test_collector_readonly.py. GitHub sets CI=true,
    # which turns a missing pwsh into a failure instead of a skip.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies (from lockfile)
        run: uv sync --locked --extra dev --extra web

      - name: PowerShell version
        run: pwsh --version

      - name: Collector read-only AST allowlist
        run: .venv/bin/pytest -q -n0 tests/test_collector_readonly.py

  browser:
    # Real Chromium against a live `gpo-lens serve` (tests/browser/): primary
    # navigation, keyboard operation, a triage round-trip, ZIP upload, and an
    # axe-core scan that fails on new serious/critical violations or on a stale
    # baseline entry. Deselected from the default pytest run by the marker.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies (from lockfile)
        run: uv sync --locked --extra dev --extra web

      # The browser build is tied to the locked playwright version, so the
      # lockfile hash is the cache key.
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium and its system dependencies
        run: .venv/bin/playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: .venv/bin/pytest -m browser -n0 -p no:cacheprovider --output "${RUNNER_TEMP}/playwright"

  pester:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Pester
        shell: powershell
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1 -ErrorAction Stop

      - name: Run PowerShell tests
        shell: powershell
        run: |
          $result = Invoke-Pester -Path tests/powershell/*.Tests.ps1 -Output Detailed -CI -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
